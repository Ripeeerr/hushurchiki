<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Славики</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="stone-texture"></div>
    <header>
      <div class="eyebrow">Дивизион Забайкальского края</div>
      <h1>
        Читинские
        <br />
        Хушуры
      </h1>
      <p class="subtitle">Семь бойцов и один хушур на всех</p>
      <div class="divider"></div>
    </header>
    <section class="about">
      <div class="section-title">О команде</div>
      <p class="about-text">
        Читинские Хушуры - это не просто пять (ну, семь) человек в одной игре. Это братство,
        скреплённое мясной начинкой в тесте.
      </p>
      <div class="stats">
        <div class="stat-card">
          <div class="stat-num">7</div>
          <div class="stat-label">Героев в составе</div>
        </div>
        <div class="stat-card">
          <div class="stat-num">∞</div>
          <div class="stat-label">Хушуров съедено</div>
        </div>
        <div class="stat-card">
          <div class="stat-num">100%</div>
          <div class="stat-label">Братского духа</div>
        </div>
      </div>
    </section>
    <section class="imgs">
      <img class="worm" src="img/logo.jpg" alt="" width="250" height="202" />
      <img class="Mujik" src="Без имени.jpg" alt="" width="1000" height="1000" />
    </section>
  </body>
</html>
